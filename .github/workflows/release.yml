name: Windows Release

on:
  push:
    tags:
      - v0.1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked UI dependencies
        working-directory: desktop/ui
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Install locked Tauri dependencies
        working-directory: desktop
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Check release version
        shell: pwsh
        run: |
          $config = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($config.version)"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match app version $($config.version)."
          }
      - name: Package Python engine
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e backend "pyinstaller==6.17.0"
          python -m PyInstaller --noconfirm --clean --onefile --name tomato-agent-engine --paths backend --collect-all tiktoken --collect-all uvicorn --hidden-import tiktoken_ext.openai_public --distpath backend/dist --workpath "$env:RUNNER_TEMP\pyinstaller" backend/app/desktop/bootstrap.py
          if (!(Test-Path backend/dist/tomato-agent-engine.exe)) {
            throw "The bundled Python engine was not created."
          }
      - name: Build NSIS installer
        working-directory: desktop
        shell: pwsh
        run: pnpm exec tauri build -- --locked
      - name: Prepare checksums and manifest
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $installers = @(Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*_x64-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected one x64 NSIS installer, found $($installers.Count)."
          }
          $releaseDirectory = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          $fileName = "Tomato-Agent-0.1.0-x64-setup.exe"
          $installerPath = Join-Path $releaseDirectory $fileName
          Copy-Item $installers[0].FullName $installerPath
          $installer = Get-Item $installerPath
          $sha256 = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $encoding = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            "$installerPath.sha256",
            "$sha256 *$fileName`n",
            $encoding
          )
          $manifest = [ordered]@{
            version = "0.1.0"
            tag = "v0.1.0"
            commit = $env:SOURCE_COMMIT
            target = "windows-x64"
            file = $fileName
            size_bytes = $installer.Length
            sha256 = $sha256
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $releaseDirectory "manifest.json"),
            ($manifest | ConvertTo-Json -Depth 3) + "`n",
            $encoding
          )
      - name: Upload dry-run build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0'
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ github.run_id }}
          path: release-assets
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd release-assets && sha256sum --check Tomato-Agent-0.1.0-x64-setup.exe.sha256)
          jq --exit-status \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            '.version == "0.1.0" and .tag == $tag and .commit == $commit and .target == "windows-x64"' \
            release-assets/manifest.json
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "Tomato Agent $GITHUB_REF_NAME" \
              --notes-file docs/releases/v0.1.0.md
          fi
          is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')
          if [[ "$is_draft" != "true" ]]; then
            echo "Refusing to replace assets on an already-published release." >&2
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --title "Tomato Agent $GITHUB_REF_NAME" \
            --notes-file docs/releases/v0.1.0.md
          gh release upload "$GITHUB_REF_NAME" \
            release-assets/Tomato-Agent-0.1.0-x64-setup.exe \
            release-assets/Tomato-Agent-0.1.0-x64-setup.exe.sha256 \
            release-assets/manifest.json \
            --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
