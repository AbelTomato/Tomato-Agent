name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.13
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked UI dependencies
        working-directory: desktop/ui
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Install locked Tauri dependencies
        working-directory: desktop
        shell: pwsh
        run: pnpm install --frozen-lockfile
      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = (python scripts/release_version.py --tag $env:GITHUB_REF_NAME).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Release tag validation failed." }
            $releaseTag = $env:GITHUB_REF_NAME
          } else {
            $version = (python scripts/release_version.py --check-current).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Current release metadata validation failed." }
            $releaseTag = $null
          }
          $state = "RELEASE_VERSION=$version`nRELEASE_TAG=$releaseTag`n"
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            $state,
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Package Python engine
        shell: pwsh
        run: |
          uv sync --locked --project backend --no-dev --group build
          if ($LASTEXITCODE -ne 0) { throw "Could not install locked Python engine build dependencies." }
          $enginePython = "backend/.venv/Scripts/python.exe"
          & $enginePython -m PyInstaller --noconfirm --clean --onefile --name tomato-agent-engine --paths backend --collect-all tiktoken --collect-all uvicorn --hidden-import tiktoken_ext.openai_public --distpath backend/dist --workpath "$env:RUNNER_TEMP\pyinstaller" backend/app/desktop/bootstrap.py
          if ($LASTEXITCODE -ne 0) { throw "Windows Python engine packaging failed." }
          if (!(Test-Path backend/dist/tomato-agent-engine.exe)) {
            throw "The bundled Python engine was not created."
          }
      - name: Build NSIS installer
        working-directory: desktop
        shell: pwsh
        run: pnpm exec tauri build -- --locked
      - name: Prepare checksums and manifest
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $installers = @(Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*_x64-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected one x64 NSIS installer, found $($installers.Count)."
          }
          $releaseDirectory = Join-Path $env:RUNNER_TEMP "release-assets"
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          $config = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $productName = $config.productName -replace '\s+', '-'
          $fileName = "$productName-$env:RELEASE_VERSION-x64-setup.exe"
          $installerPath = Join-Path $releaseDirectory $fileName
          Copy-Item $installers[0].FullName $installerPath
          $installer = Get-Item $installerPath
          $sha256 = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $encoding = [System.Text.UTF8Encoding]::new($false)
          $manifestTag = $env:RELEASE_TAG
          if (!$manifestTag) { $manifestTag = $null }
          [System.IO.File]::WriteAllText(
            "$installerPath.sha256",
            "$sha256 *$fileName`n",
            $encoding
          )
          $manifest = [ordered]@{
            version = $env:RELEASE_VERSION
            tag = $manifestTag
            commit = $env:SOURCE_COMMIT
            target = "windows-x64"
            file = $fileName
            size_bytes = $installer.Length
            sha256 = $sha256
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $releaseDirectory "manifest.json"),
            ($manifest | ConvertTo-Json -Depth 3) + "`n",
            $encoding
          )
      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7

  create-draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ github.run_id }}
          path: release-assets
      - name: Create or update Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          installer=$(jq -er '.file' release-assets/manifest.json)
          (cd release-assets && sha256sum --check "$installer.sha256")
          digest=$(sha256sum "release-assets/$installer" | cut -d ' ' -f 1)
          size_bytes=$(wc -c < "release-assets/$installer" | tr -d '[:space:]')
          jq --exit-status \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg installer "$installer" \
            --arg digest "$digest" \
            --argjson size_bytes "$size_bytes" \
            '.version == $version and .tag == $tag and .commit == $commit and .target == "windows-x64" and .file == $installer and .sha256 == $digest and .size_bytes == $size_bytes' \
            release-assets/manifest.json
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "Tomato Agent $GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          fi
          is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')
          if [[ "$is_draft" != "true" ]]; then
            echo "Refusing to replace assets on an already-published release." >&2
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" \
            --title "Tomato Agent $GITHUB_REF_NAME" \
            --notes-file "$notes_file"
          gh release upload "$GITHUB_REF_NAME" \
            "release-assets/$installer" \
            "release-assets/$installer.sha256" \
            release-assets/manifest.json \
            --clobber
